name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci --prefix ui

      - run: npm run build --prefix ui -- --outDir ../backend/internal/app/web/dist

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: backend/internal/app/web/dist/
          retention-days: 1

  version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      changelog: ${{ steps.version.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag version
        id: tag_version
        if: github.event_name == 'push'
        uses: anothrNick/github-tag-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.tag_version.outputs.new_tag }}
          CHANGELOG: ${{ steps.tag_version.outputs.changelog }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="${RELEASE_TAG#v}"
            TAG="$RELEASE_TAG"
          else
            VERSION="$(node -p "require('./electron/package.json').version")"
            TAG=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo 'changelog<<EOF' >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo 'EOF' >> "$GITHUB_OUTPUT"

  build:
    needs: [build-ui, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ext: ""
          - os: macos-latest
            platform: mac
            ext: ""
          - os: windows-latest
            platform: win
            ext: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: backend/internal/app/web/dist/

      - name: Build Go binary
        working-directory: backend
        run: go build -trimpath -ldflags="-s -w" -o ../dist/krio-chat${{ matrix.ext }} .

      - name: Install electron dependencies
        run: npm ci --prefix electron

      - name: Set release version
        run: npm version --prefix electron --no-git-tag-version --allow-same-version "${{ needs.version.outputs.version }}"

      - name: Package desktop app
        run: npm run dist --prefix electron

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            electron/dist/*.dmg
            electron/dist/*.exe
            electron/dist/*.AppImage
            electron/dist/*.yml
            !electron/dist/builder-debug.yml
            dist/krio-chat${{ matrix.ext }}
          retention-days: 7

  release:
    needs: [build, version]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          body: ${{ needs.version.outputs.changelog }}
          files: |
            artifacts/desktop-*/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
